<header id="top">
  <div class="star">IT’S<br>GAMIN’<br>TIME</div>
  <h1><a href="{{ "/" | relLangURL }}">{{ site.Title }}</a></h1>
  {{ with site.Params.subtitle }}<p>{{ . }}</p>{{ end }}
</header>
<nav>
  <a href="{{ "/" | relLangURL }}"><i class="fas fa-home"></i> Home</a>
  {{ $page := . }}
  {{ range site.Menus.main.ByWeight }}<a href="{{ .URL }}"{{ if or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) }} class="on"{{ end }}>{{ .Pre }} {{ or .Title .Name }}</a>{{ end }}
  <a href="{{ "index.xml" | relURL }}"><i class="fas fa-rss"></i> RSS</a>
</nav>
